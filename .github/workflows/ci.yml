name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast, hermetic tests — no external API calls (mocked). Always run.
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit + integration tests
        run: npx jest tests/unit tests/integration --runInBand

  # Safety gate — runs the crisis-detection eval and fails the build if it
  # regresses. Needs only GROQ_API_KEY (the guardrail model); cheap to run.
  # Add GROQ_API_KEY under repo Settings → Secrets and variables → Actions.
  safety-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Crisis-detection safety gate
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY secret not set — skipping safety gate. Add it in repo Settings → Secrets → Actions to enable."
            exit 0
          fi
          node eval/runSafety.js --gate
